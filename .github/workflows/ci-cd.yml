name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: 333-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter (TypeScript check)
        run: npm run typecheck

      - name: Apply database migrations
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/333-test"
        run: npx prisma migrate deploy

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/333-test"
        run: npm test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          # Render automatically deploys on push to main if connected via GitHub
          # No additional steps needed if using Render's GitHub integration
          # Otherwise, use Render API to trigger deployment
